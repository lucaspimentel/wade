[package]
name = "wade"
version = "0.1.0"
edition = "2024"
description = "TUI file browser (Rust port of the C# Native AOT tool)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tga", "tiff", "pnm"] }
kamadak-exif = "0.6.1"
msi = "0.8"
pulldown-cmark = { version = "0.13.4", default-features = false }
roxmltree = "0.21"
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(not(windows))'.dependencies]
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
