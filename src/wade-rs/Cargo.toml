[package]
name = "wade"
version = "0.1.0"
edition = "2024"
description = "TUI file browser (Rust port of the C# Native AOT tool)"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
pulldown-cmark = { version = "0.13.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
