name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0); not needed for a dry run'
        required: false
        type: string
      dry_run:
        description: 'Build, test and upload the archives without creating a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    steps:
    - name: Check inputs
      if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.version == ''
      run: |
        echo "A version is required unless dry_run is set."
        exit 1

  # The same checks as a push to main: tests on Windows, Linux and macOS,
  # formatting and clippy
  ci:
    needs: check-inputs
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            exe: wade.exe
            archive: zip
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-musl
            exe: wade
            archive: tar.gz
            rustflags: ''

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Build
      working-directory: src/wade-rs
      env:
        RUSTFLAGS: ${{ matrix.rustflags }}
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Copy binary and documentation
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist | Out-Null
        Copy-Item src/wade-rs/target/${{ matrix.target }}/release/${{ matrix.exe }} dist/
        Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
        Copy-Item README.md dist/

    - name: Check binary
      shell: pwsh
      run: |
        $version = & ./dist/${{ matrix.exe }} --version
        if ($LASTEXITCODE -ne 0) { throw "--version failed with exit code $LASTEXITCODE" }
        Write-Host "wade --version: $version"
        if ($version -notmatch '^wade \d+\.\d+\.\d+\+[0-9a-f]{40}$') { throw "Unexpected version: $version" }
        if ($IsLinux) {
          $info = file dist/${{ matrix.exe }}
          Write-Host $info
          if ($info -notmatch 'statically linked|static-pie linked') { throw "Linux binary is not statically linked" }
        }

    - name: Create archive (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      run: |
        Compress-Archive -Path dist/* -DestinationPath wade-${{ matrix.rid }}.zip

    - name: Create archive (Linux)
      if: matrix.archive == 'tar.gz'
      run: |
        cd dist
        tar -czf ../wade-${{ matrix.rid }}.tar.gz *
        cd ..

    - name: Generate checksum
      shell: pwsh
      run: |
        $hash = Get-FileHash -Path wade-${{ matrix.rid }}.${{ matrix.archive }} -Algorithm SHA256
        "$($hash.Hash)  wade-${{ matrix.rid }}.${{ matrix.archive }}" | Out-File -FilePath checksum-${{ matrix.rid }}.txt -Encoding ascii

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wade-${{ matrix.rid }}
        path: |
          wade-${{ matrix.rid }}.${{ matrix.archive }}
          checksum-${{ matrix.rid }}.txt

  release:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

    - name: Combine checksums
      run: |
        cat wade-win-x64/checksum-win-x64.txt > checksums.txt
        cat wade-linux-x64/checksum-linux-x64.txt >> checksums.txt

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        generate_release_notes: true
        files: |
          wade-win-x64/wade-win-x64.zip
          wade-linux-x64/wade-linux-x64.tar.gz
          checksums.txt
